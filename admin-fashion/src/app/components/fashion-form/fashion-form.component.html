<div class="form-container">
  <div class="form-header">
    <h2>{{ isEditMode ? '✏️ Chỉnh sửa Fashion' : '➕ Thêm mới Fashion' }}</h2>
    <button class="btn btn-secondary" (click)="goBack()">← Quay lại</button>
  </div>

  <div class="alert alert-success" *ngIf="successMsg">✅ {{ successMsg }}</div>
  <div class="alert alert-danger" *ngIf="errorMsg">❌ {{ errorMsg }}</div>

  <div class="loading-spinner" *ngIf="loading">
    <div class="spinner"></div>
    <p>Đang tải dữ liệu...</p>
  </div>

  <form (ngSubmit)="onSubmit()" *ngIf="!loading" class="fashion-form">
    <div class="form-grid">
      <!-- Tiêu đề -->
      <div class="form-group full-width">
        <label for="tieude">Tiêu đề Fashion <span class="required">*</span></label>
        <input id="tieude" type="text" [(ngModel)]="fashion.tieude" name="tieude"
               placeholder="Nhập tiêu đề fashion..." class="form-control" required />
      </div>

      <!-- Style -->
      <div class="form-group">
        <label for="style">Style <span class="required">*</span></label>
        <select id="style" [(ngModel)]="fashion.style" name="style" class="form-control" required>
          <option value="">-- Chọn Style --</option>
          <option *ngFor="let s of stylesOptions" [value]="s">{{ s }}</option>
        </select>
        <input type="text" [(ngModel)]="fashion.style" name="styleCustom" class="form-control mt-1"
               placeholder="Hoặc nhập style tùy chỉnh..." />
      </div>

      <!-- Ngày tạo -->
      <div class="form-group">
        <label for="ngaytao">Ngày tạo</label>
        <input id="ngaytao" type="date" [(ngModel)]="fashion.ngaytao" name="ngaytao" class="form-control" />
      </div>

      <!-- Thumbnail -->
      <div class="form-group full-width">
        <label>Hình Thumbnail</label>
        <div class="thumbnail-section">
          <div class="thumbnail-preview" *ngIf="getThumbnailUrl()">
            <img [src]="getThumbnailUrl()" alt="Preview" class="preview-img" />
          </div>
          <div class="thumbnail-inputs">
            <div class="file-upload-area">
              <label for="file-upload" class="file-upload-label">
                📁 Chọn file ảnh
              </label>
              <input id="file-upload" type="file" accept="image/*" (change)="onFileSelected($event)" class="file-input" />
              <span class="file-name" *ngIf="selectedFile">{{ selectedFile.name }}</span>
            </div>
            <div class="url-input">
              <input type="text" [(ngModel)]="fashion.thumbnail" name="thumbnail"
                     placeholder="Hoặc nhập URL hình ảnh..." class="form-control" />
            </div>
          </div>
        </div>
      </div>

      <!-- Chi tiết (TinyMCE) -->
      <div class="form-group full-width">
        <label for="chitiet-editor">Chi tiết Fashion (WYSIWYG Editor)</label>
        <textarea id="chitiet-editor" name="chitiet" [(ngModel)]="fashion.chitiet"
                  placeholder="Nhập nội dung chi tiết..."></textarea>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="saving">
        <span *ngIf="saving">⏳ Đang lưu...</span>
        <span *ngIf="!saving">{{ isEditMode ? '💾 Cập nhật' : '✅ Thêm mới' }}</span>
      </button>
      <button type="button" class="btn btn-secondary" (click)="goBack()">Hủy</button>
    </div>
  </form>
</div>
