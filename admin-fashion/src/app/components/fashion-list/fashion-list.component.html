<div class="admin-container">
  <div class="admin-header">
    <h1>🌟 Quản trị Fashion</h1>
    <button class="btn btn-success" (click)="addNew()">
      ➕ Thêm mới Fashion
    </button>
  </div>

  <div class="alert alert-success" *ngIf="successMsg">{{ successMsg }}</div>
  <div class="alert alert-danger" *ngIf="errorMsg">{{ errorMsg }}</div>

  <div class="loading-spinner" *ngIf="loading">
    <div class="spinner"></div>
    <p>Đang tải dữ liệu...</p>
  </div>

  <div class="table-responsive" *ngIf="!loading">
    <table class="fashion-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Thumbnail</th>
          <th>Tiêu đề</th>
          <th>Style</th>
          <th>Ngày tạo</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let fashion of fashions; let i = index">
          <td>{{ i + 1 }}</td>
          <td class="thumbnail-cell">
            <img [src]="getThumbnailUrl(fashion.thumbnail)" [alt]="fashion.tieude" class="thumbnail-img" />
          </td>
          <td class="title-cell">{{ fashion.tieude }}</td>
          <td>
            <span class="style-badge">{{ fashion.style }}</span>
          </td>
          <td>{{ fashion.ngaytao | date: 'dd/MM/yyyy' }}</td>
          <td class="action-cell">
            <button class="btn btn-info btn-sm" (click)="viewDetail(fashion._id!)">👁 Xem</button>
            <button class="btn btn-warning btn-sm" (click)="editFashion(fashion._id!)">✏️ Sửa</button>
            <button class="btn btn-danger btn-sm" (click)="deleteFashion(fashion)">🗑 Xóa</button>
          </td>
        </tr>
        <tr *ngIf="fashions.length === 0">
          <td colspan="6" class="empty-row">Chưa có fashion nào</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
