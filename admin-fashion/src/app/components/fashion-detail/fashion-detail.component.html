<div class="detail-container">
  <div class="detail-header">
    <h2>👁 Chi tiết Fashion</h2>
    <div class="header-actions">
      <button class="btn btn-warning" (click)="editFashion()" *ngIf="fashion">✏️ Sửa</button>
      <button class="btn btn-secondary" (click)="goBack()">← Quay lại</button>
    </div>
  </div>

  <div class="alert alert-danger" *ngIf="errorMsg">{{ errorMsg }}</div>

  <div class="loading-spinner" *ngIf="loading">
    <div class="spinner"></div>
    <p>Đang tải...</p>
  </div>

  <div class="detail-card" *ngIf="fashion && !loading">
    <div class="detail-top">
      <div class="detail-image">
        <img [src]="getThumbnailUrl()" [alt]="fashion.tieude" class="detail-img" />
      </div>
      <div class="detail-info">
        <h1 class="fashion-title">{{ fashion.tieude }}</h1>
        <div class="info-row">
          <span class="info-label">Style:</span>
          <span class="style-badge">{{ fashion.style }}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Ngày tạo:</span>
          <span>{{ fashion.ngaytao | date: 'dd/MM/yyyy HH:mm' }}</span>
        </div>
        <div class="info-row">
          <span class="info-label">ID:</span>
          <code>{{ fashion._id }}</code>
        </div>
      </div>
    </div>

    <div class="detail-content">
      <h3>📝 Chi tiết</h3>
      <div class="content-body" [innerHTML]="fashion.chitiet"></div>
    </div>
  </div>
</div>
